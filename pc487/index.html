<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Forest Maze Survival</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script>
</head>
<body>
    <main id="game-shell" aria-label="PC487 game prototype">
        <canvas id="render-canvas"></canvas>
        <section id="hud" aria-label="Game status">
            <div>
                <p class="eyebrow">PC487</p>
                <h1>Forest Maze Survival</h1>
                <p id="interaction-prompt" class="hud-note" aria-live="polite"></p>
            </div>
            <div class="hud-actions">
                <div id="inventory-panel" aria-label="Inventory">
                    <p class="eyebrow">Inventory</p>
                    <p id="inventory-slot">Empty</p>
                </div>
                <button id="debug-teleport" type="button">To Truck</button>
                <button id="debug-noclip" type="button" aria-pressed="false">Noclip</button>
                <button id="debug-toggle" type="button" aria-pressed="false">Debug</button>
            </div>
        </section>
        <section id="mobile-controls" aria-label="Mobile movement controls">
            <div id="camera-touch-zone" aria-label="Camera look area"></div>
            <div id="move-joystick" aria-label="Move character">
                <div id="move-stick"></div>
            </div>
            <button id="mobile-shoot" type="button">Fire</button>
            <button id="mobile-pickup" type="button">Pick Up</button>
            <button id="mobile-vehicle-action" type="button">Enter</button>
        </section>
        <noscript>
            <p class="noscript">PC487 needs JavaScript enabled to run.</p>
        </noscript>
    </main>
    <script type="module" src="src/main.js"></script>
</body>
</html>
